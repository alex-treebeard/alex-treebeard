  </defs>
  <rect width="32" height="32" fill="#6a5a3a"/>
  <rect x="1" y="1" width="14" height="14" fill="#c9bd9c"/>
  <rect x="17" y="1" width="14" height="14" fill="#b3a47e"/>
  <rect x="1" y="17" width="14" height="14" fill="#b3a47e"/>
  <rect x="17" y="17" width="14" height="14" fill="#c9bd9c"/>
  <rect width="32" height="32" filter="url(#grain)" opacity="0.6"/>
